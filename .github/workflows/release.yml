name: Release

# git tag v1.1 && git push --tags
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DIST_CERT_P12 }}
          p12-password: ${{ secrets.CERT_PASSWORD }}

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      # VERSION comes from the tag (v1.0.3 → 1.0.3); BUILD is a timestamp,
      # which always beats whatever is already in App Store Connect.
      - run: make release VERSION=${GITHUB_REF_NAME#v}
